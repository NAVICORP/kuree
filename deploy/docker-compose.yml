# Kuree on one server: Postgres, the Kuree API, and the site in front of it.
# Deployed with Dokploy from this repository (GitHub provider, compose path
# ./deploy/docker-compose.yml), which builds the image on the server itself.
# The domains kureeapp.com, www.kureeapp.com and kuree.skifi.co go to service
# `site`, port 8000. The site moves pages on the old addresses to kureeapp.com.
#
# Passwords: the first start makes random ones inside the `secrets` volume.
# Sign-in (WhatsApp codes, email codes) is SkAuth at account.skifi.co, where
# Kuree has to be listed as an app (id "kuree"). Nothing to paste here.

services:
  secrets:
    image: alpine:3.22
    restart: "no"
    volumes:
      - secrets:/secrets
    command:
      - sh
      - -c
      - |
        set -e
        for f in db_password authenticator_password jwt_secret; do
          if [ ! -s /secrets/$$f ]; then
            head -c 48 /dev/urandom | base64 | tr -d '\n/+=' > /secrets/$$f
          fi
        done
        chmod 644 /secrets/*

  db:
    image: ghcr.io/navicorp/farmi-life-db:latest
    restart: unless-stopped
    depends_on:
      secrets:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: kuree
      POSTGRES_PASSWORD_FILE: /secrets/db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/secrets:ro
      - backups:/backups
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kuree"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The database API, sign-in (passed on to SkAuth) and the server functions.
  # The site reaches it as `kuree-api`: plain `api` is also the name of other
  # apps' services on Dokploy's shared network.
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kuree-api:latest
    pull_policy: build
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_NAME: kuree
      # How SkAuth knows Kuree (its `api` in SKAUTH_APPS): keep it as it is, or
      # sign-in stops until SKAUTH_APPS changes too. Members never see it.
      API_URL: https://kuree.skifi.co
      SITE_URL: https://kureeapp.com
      AUTH_MODE: app
      AUTH_PROVIDER_URL: https://account.skifi.co
      APP_ID: kuree
      WEB_DIR: ""
      BOYSTOWN_URL: https://boystown.skifi.co
    volumes:
      - secrets:/secrets:ro
    networks:
      default:
        aliases:
          - kuree-api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # The members' pages, the spreadsheets, the plain pages, and the door to the API.
  site:
    build:
      context: ..
      dockerfile: Dockerfile
    image: kuree-site:latest
    pull_policy: build
    restart: unless-stopped
    command: ["node", "/srv/site/server/site.mjs"]
    expose:
      - "8000"
    environment:
      API_INTERNAL: http://kuree-api:8000
      SITE_URL: https://kureeapp.com
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # A database copy every night at 03:00 server time, the last 30 kept.
  backup:
    image: ghcr.io/navicorp/farmi-life-db:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - secrets:/secrets:ro
      - backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        export PGPASSWORD="$$(cat /secrets/db_password)"
        while true; do
          now=$$(date +%H%M)
          if [ "$$now" = "0300" ]; then
            f=/backups/kuree-$$(date +%Y%m%d-%H%M).dump
            pg_dump -h db -U postgres -d kuree -Fc -f "$$f.part" && mv "$$f.part" "$$f" && echo "backup $$f"
            ls -1t /backups/kuree-*.dump 2>/dev/null | tail -n +31 | xargs -r rm -f
            sleep 61
          fi
          sleep 30
        done

# Fixed names, so the data never depends on what Dokploy calls the project.
volumes:
  pgdata:
    name: kuree_pgdata
  secrets:
    name: kuree_secrets
  backups:
    name: kuree_backups
