# Packs the Play pictures as a build artifact, so they can be put into Play
# Console straight from the browser. Runs on pushes to the store-zip branch.
name: Store pictures zip
on:
  push:
    branches: [store-zip]
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-artifact@v4
        with:
          name: play-pictures
          path: |
            store/play/*.png
          compression-level: 0
          retention-days: 3
